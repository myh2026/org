name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # dist/ 产物回写提交需要

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 幂等：仓库已 vendored toolchain/dhv-ts，此步通常直接命中退出
      - name: HSL 工具链就位（vendored 优先）
        run: bun scripts/setup-hsl.ts

      - name: dhv check 全部 HSL 源码（hsl/ + probe/ + dist/ 铸出专家）
        run: bun cli/org.ts check

      - name: 机制级测试（结构闸门 / README 走读 / 动力学点火）
        run: bun test tests/

      # TUI：离屏冒烟（纯渲染 + 事件管线 + 进程内桥真实执行），无 TTY 可跑
      - name: TUI 冒烟（离屏 20 断言 + 进程内引擎桥）
        run: bun tui/smoke.ts

      # 单二进制分发前置：payload 必须与 hsl/toolchain/demo-ws/fixtures 逐字节同步
      - name: payload 新鲜度（build-bin 再生后不允许有 diff）
        run: |
          bun scripts/build-bin.ts --payload-only
          if [[ -n "$(git status --porcelain build/payload.json)" ]]; then
            echo "::error::build/payload.json 过期——运行 bun scripts/build-bin.ts --payload-only 后提交"
            git diff -- build/payload.json | head -40
            exit 1
          fi

      # 单二进制冒烟：当前平台产物 + 无 bun 环境（进程内兜底车道）双验证
      - name: 单二进制冒烟（含无 bun 环境）
        run: |
          bun scripts/build-bin.ts
          ./build/org check | tail -1
          ./build/org tui --print > /tmp/frame.txt && head -3 /tmp/frame.txt
          # 无 bun 环境：进程内兜底车道全链路（check / demo / TUI 帧）
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ./build/org check | tail -1
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ./build/org demo | tail -3
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ./build/org tui --print --demo > /tmp/frame2.txt && head -3 /tmp/frame2.txt

      - name: 全叙事冒烟（三连跑 + 直连 + 暖移交，自动导出 dist/demo）
        run: bun cli/org.ts demo

      - name: status 冒烟
        run: bun cli/org.ts status

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-demo-run
          path: demo-run/out-*
          retention-days: 7
          if-no-files-found: ignore

      # 编译产物与源码同库演进：demo 再生后有变化则自动回写（[skip ci] 防循环）
      - name: dist/ 产物回写
        run: |
          git config user.email "ci@org.local"
          git config user.name "org-ci"
          if [[ -n "$(git status --porcelain dist/)" ]]; then
            git add dist/
            git commit -m "chore(dist): regenerate demo artifacts [skip ci]"
            git push
          else
            echo "dist/ 无变化，跳过回写"
          fi

  # ── 三平台原生冒烟（Windows / macOS 真实执行） ────────────────────────────
  # ubuntu job 覆盖逻辑正确性与 linux 产物；release 的五平台产物由 ubuntu
  # 交叉编译产出。本 job 补齐最后一块：在真实 macOS / Windows 运行器上组装
  # 当前平台单二进制并真实执行 —— Windows 路径语义、macOS(arm64) 运行时、
  # TUI 帧渲染的平台回归都在这里拦截。
  native-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bin: build/org
          - os: windows-latest
            bin: build/org.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: HSL 工具链就位（vendored 优先）
        run: bun scripts/setup-hsl.ts

      - name: 组装当前平台单二进制（无参数 = 仅宿主平台）
        run: bun scripts/build-bin.ts

      - name: 原生执行冒烟（check / demo / TUI 帧）
        shell: bash
        run: |
          set -o pipefail
          BIN="${{ matrix.bin }}"
          "$BIN" check | tail -2
          "$BIN" demo | tail -3
          "$BIN" tui --print > frame.txt && head -3 frame.txt
          test -s frame.txt && echo "✓ TUI 帧非空（原生 ${{ matrix.os }}）"
