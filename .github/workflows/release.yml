name: release

on:
  push:
    tags: ["v*"]
  # 手动补发通道（tag push 事件偶发不触发时的兜底：按 tag ref 派发，
  # GITHUB_REF_NAME 语义与 tag push 完全一致）
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  # ── 校验（与 CI 同套门槛，全绿才进构建） ──────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: HSL 工具链就位（vendored 优先）
        run: bun scripts/setup-hsl.ts

      - name: 发布前校验（check + test + tui:smoke + demo 冒烟）
        run: |
          bun cli/org.ts check
          bun test tests/
          bun tui/smoke.ts
          bun cli/org.ts demo

  # ── 五平台二进制矩阵（Windows / macOS Intel+Apple / Linux x64+arm64） ──
  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-linux-x64
            artifact: org-linux-x64.zip
          - target: bun-linux-arm64
            artifact: org-linux-arm64.zip
          - target: bun-darwin-x64
            artifact: org-darwin-x64.zip
          - target: bun-darwin-arm64
            artifact: org-darwin-arm64.zip
          - target: bun-windows-x64
            artifact: org-windows-x64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 编译 ${{ matrix.target }}
        run: |
          NAME="org"
          [[ "${{ matrix.target }}" == bun-windows-x64 ]] && NAME="org.exe"
          bun build --compile --target=${{ matrix.target }} \
            --external z-ai-web-dev-sdk \
            --outfile "dist-bin/${NAME}" cli/org.ts
          ls -lh dist-bin/

      - name: 打包（zip：单文件 + 一行说明）+ sha256 旁车
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p pkg
          cp dist-bin/org* pkg/
          {
            echo "ORG — Organization Harness（单二进制）"
            echo ""
            echo "  解压后把 org（或 org.exe）放入 PATH，然后："
            echo ""
            echo "    org            打开组织驾驶舱（TUI）"
            echo "    org demo       全叙事演示（无需 bun / 无外联）"
            echo "    org run --task \"...\"   团队模式派单"
            echo "    org check      结构闸门全量校验"
            echo ""
            echo "  工作区默认 ~/.org/workspace · 运行时资源自动解包 ~/.org/runtime-<hash>"
            echo "  主页：https://github.com/myh2026/org"
          } > pkg/README.txt
          (cd pkg && zip -qr "../${{ matrix.artifact }}" .)
          mv "${{ matrix.artifact }}" /tmp/
          # 生成校验和旁车（官网下载区自动读取展示；本地校验： shasum -a 256 -c <file>.sha256）
          (cd /tmp && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256")
          cat "/tmp/${{ matrix.artifact }}.sha256"
          ls -lh /tmp/${{ matrix.artifact }}*

      - name: 上传构建产物（供 release 汇总）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            /tmp/${{ matrix.artifact }}
            /tmp/${{ matrix.artifact }}.sha256
          retention-days: 3

  # ── 发布（源码包 + dist 快照 + 5 平台二进制） ─────────────────────────
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 发布说明（取 CHANGELOG 对应版本段落）
        run: |
          VERSION="${GITHUB_REF_NAME}"
          awk -v sec="## ${VERSION}" '
            $0 ~ "^"sec {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "（未找到 ${VERSION} 的 CHANGELOG 段落，参见 CHANGELOG.md）" > /tmp/release-notes.md
          fi

      - name: 源码与 dist 快照打包（先写 /tmp 再移回，规避 tar 自读自写）+ sha256 旁车
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar --exclude='.git' --exclude='demo-run' --exclude='.hsl-runs' \
              --exclude='node_modules' --exclude='dist-bin' --exclude='*.tgz' --exclude='*.zip' \
              -czf "/tmp/org-${VERSION}-src.tar.gz" .
          cd dist && zip -qr "/tmp/org-${VERSION}-dist.zip" . && cd -
          # 校验和旁车（与平台二进制同规格）
          (cd /tmp && sha256sum org-*.tar.gz org-*-dist.zip > org-checksums-src.txt && \
            for f in org-*.tar.gz org-*-dist.zip; do sha256sum "$f" > "$f.sha256"; done)
          cat /tmp/org-checksums-src.txt
          ls -lh /tmp/org-*

      - name: 创建 GitHub Release（5 平台二进制 + 源码 + dist 快照 + 全部 sha256 旁车）
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: |
            release-assets/org-*.zip
            release-assets/org-*.zip.sha256
            /tmp/org-*.tar.gz
            /tmp/org-*.tar.gz.sha256
            /tmp/org-*-dist.zip
            /tmp/org-*-dist.zip.sha256
            /tmp/org-checksums-src.txt
