# ============================================================================
# bunfig.toml — Bun 运行配置
# ----------------------------------------------------------------------------
# preload：环境兼容层（受限内核上 Bun rmSync 的多重优雅降级链，见
# lib/fssafe.ts）。同时挂顶层与 [test] 段：覆盖 CLI / TUI / web / 脚本 /
# 测试全部 bun 入口。常规内核上零行为变化（仅原生失败时逐级降级）。
# 关闭开关：ORG_FSSAFE_OFF=1。
# ============================================================================
preload = ["./lib/fssafe-preload.ts"]

[test]
preload = ["./lib/fssafe-preload.ts"]
